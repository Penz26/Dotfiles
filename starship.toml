# ==============================================================================
#  Starship Theme - Generated dynamically via Matugen (Material You M3)
# ==============================================================================

add_newline = false

format = """
$cmd_duration $directory $git_branch $git_commit $git_status $python
  $character"""

[fill]
symbol = '-'
style = 'fg:#504539'

[character]
success_symbol = "[~❯](bold fg:#f7bc70)"
error_symbol = "[ ](bold fg:#ffb4ab)"

[package]
disabled = true

[git_branch]
style = "bg:#57432b"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:#57432b)[$symbol $branch(:$remote_branch)](fg:#fcdebc bg:#57432b)[ ](bold fg:#57432b)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold fg:#ffb4ab)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](bold fg:#bacd9f)'
renamed = " ✍️ "
deleted = " 🗑 "

[python]
format = "[${symbol}${pyenv_prefix}${version} (${virtualenv})]($style) "
pyenv_version_name = false
pyenv_prefix = "pyenv "
style = "bold fg:#bacd9f"
symbol = "🐍 "
detect_extensions = []
detect_files = []

[hostname]
ssh_only = false
format = "[•$hostname](bg:#57432b bold fg:#fcdebc)[](bold fg:#57432b)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed fg:#bacd9f"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:#57432b fg:#fcdebc"
style_root = "bold fg:#ffb4ab"
format = "[](bold fg:#57432b)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#643f00 fg:#ffddb6"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:#643f00)[󰉋 → $path]($style)[](bold fg:#643f00)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#504539)[󰪢 $duration](bold bg:#504539 fg:#d4c4b4)[](bold fg:#504539)'
