# ==============================================================================
#  Starship Theme - Generated dynamically via Matugen (Material You M3)
# ==============================================================================

add_newline = false

format = """
$cmd_duration $directory $git_branch $git_commit $git_status $python
  $character"""

[fill]
symbol = '-'
style = 'fg:{{colors.outline_variant.default.hex}}'

[character]
success_symbol = "[~❯](bold fg:{{colors.primary.default.hex}})"
error_symbol = "[ ](bold fg:{{colors.error.default.hex}})"

[package]
disabled = true

[git_branch]
style = "bg:{{colors.secondary_container.default.hex}}"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:{{colors.secondary_container.default.hex}})[$symbol $branch(:$remote_branch)](fg:{{colors.on_secondary_container.default.hex}} bg:{{colors.secondary_container.default.hex}})[ ](bold fg:{{colors.secondary_container.default.hex}})"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold fg:{{colors.error.default.hex}})"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](bold fg:{{colors.tertiary.default.hex}})'
renamed = " ✍️ "
deleted = " 🗑 "

[python]
format = "via [${symbol}${pyenv_prefix}${version} (${virtualenv})]($style) "
pyenv_version_name = false
pyenv_prefix = "pyenv "
style = "bold fg:{{colors.tertiary.default.hex}}"
symbol = "🐍 "
detect_extensions = []
detect_files = []

[hostname]
ssh_only = false
format = "[•$hostname](bg:{{colors.secondary_container.default.hex}} bold fg:{{colors.on_secondary_container.default.hex}})[](bold fg:{{colors.secondary_container.default.hex}})"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed fg:{{colors.tertiary.default.hex}}"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:{{colors.secondary_container.default.hex}} fg:{{colors.on_secondary_container.default.hex}}"
style_root = "bold fg:{{colors.error.default.hex}}"
format = "[](bold fg:{{colors.secondary_container.default.hex}})[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}}"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:{{colors.primary_container.default.hex}})[󰉋 → $path]($style)[](bold fg:{{colors.primary_container.default.hex}})'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:{{colors.surface_variant.default.hex}})[󰪢 $duration](bold bg:{{colors.surface_variant.default.hex}} fg:{{colors.on_surface_variant.default.hex}})[](bold fg:{{colors.surface_variant.default.hex}})'
