# ~/.config/wayle/themes/red.toml

# Sfondi principali (estrapolati dalle zone d'ombra scure del magma/cristallo)
bg = "#1a080c"
surface = "#2b0f15"
elevated = "#3d1720"

# Testo e primo piano (rosa/bianco brillante del centro dei cristalli)
fg = "#fce4ec"
fg_muted = "#8a5866"

# Colore d'accento principale (Rosso/Magenta vivido)
primary = "#ff2a5f"

# Palette dei colori base
red = "#ff2a5f"        # Rosso/Magenta neon
yellow = "#ff80ab"     # Rosa brillante
green = "#00e676"      # Accento verde/iridescente nei riflessi
blue = "#7c4dff"       # Viola/Ciano elettrico dei riflessi
