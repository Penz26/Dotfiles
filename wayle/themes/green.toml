# ~/.config/wayle/themes/green.toml

# Sfondi principali (ispirati al verde ottanio/smeraldo dello sfondo)
bg = "#0d2b2a"
surface = "#143a38"
elevated = "#1f4b48"

# Testo e primo piano (tonalità crema/nuvola)
fg = "#ebd8c3"
fg_muted = "#5d7e79"

# Colore d'accento principale (Verde brillante dello sfondo)
primary = "#16a085"

# Palette dei colori base
red = "#e63946"        # Rosso vivido (palloncino sul palo)
yellow = "#e9c46a"     # Giallo/Arancio warm (chioma alberi)
green = "#2a9d8f"      # Verde ottanio
blue = "#457b9d"       # Blu spento cavi/ombre
