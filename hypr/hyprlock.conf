# ~/.config/hypr/hyprlock.conf

background {
    monitor =
    path = /home/penna/Scaricati/grey.jpg
    color = rgba(25, 20, 20, 1.0)

    # Effetto sfocatura (Blur) molto elegante
    blur_passes = 2 
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# OROLOGIO
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
}

# CAMPO DI INPUT (Password)
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Percentuale della dimensione del widget
    dots_spacing = 0.15 # Spaziatura dei punti
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = false
    fade_timeout = 1000 # Millisecondi prima di nascondere il campo se vuoto
    placeholder_text = <i>Inserisci la password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}